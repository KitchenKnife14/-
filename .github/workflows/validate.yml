name: Validate Google Sheets migration

on:
  pull_request:
    branches: [main, migration/google-sheets, feature/telegram-integration]
  push:
    branches: [migration/google-sheets, audit/backend-upsert-guards, work/design-telegram-foundation, feature/telegram-integration, work/final-features-performance, ispravleniya]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record Node and npm versions
        run: node --version && npm --version
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript and production build
        run: npm run build
      - name: Production preview smoke test
        run: node tests/vite-preview-smoke.cjs
      - name: All regression tests
        run: npm test
      - name: Apps Script syntax check
        run: node --check < google-apps-script/Code.gs
      - name: Apps Script runtime diagnostics syntax check
        run: node --check < google-apps-script/PBKDF2_RUNTIME_DIAGNOSTICS.gs
      - name: Isolated Apps Script idempotency test syntax check
        run: node --check < tests/gas/IdempotencyConcurrencyTest.gs
      - name: Apps Script Telegram update concurrency test syntax check
        run: node --check < tests/gas/TelegramUpdateConcurrencyTest.gs
      - name: Apps Script read consistency concurrency test syntax check
        run: node --check < tests/gas/ReadConsistencyConcurrencyTest.gs
      - name: Apps Script monthly plan concurrency test syntax check
        run: node --check < tests/gas/MonthlyPlanConcurrencyTest.gs
      - name: Apps Script goal contribution concurrency test syntax check
        run: node --check < tests/gas/GoalContributionConcurrencyTest.gs
      - name: Apps Script transaction concurrency test syntax check
        run: node --check < tests/gas/TransactionConcurrencyTest.gs
      - name: Apps Script isolated test guard syntax check
        run: node --check < tests/gas/IsolatedTestGuard.gs
      - name: Apps Script signup/join concurrency test syntax check
        run: node --check < tests/gas/SignupJoinConcurrencyTest.gs
      - name: Apps Script backend diagnostics syntax check
        run: node --check < tests/gas/BackendSecurityDiagnostics.gs
      - name: Validate Apps Script manifest
        run: node -e "const m=JSON.parse(require('node:fs').readFileSync('google-apps-script/appsscript.json','utf8')); if(m.timeZone!=='Europe/Moscow'||m.runtimeVersion!=='V8'||m.exceptionLogging!=='STACKDRIVER') throw new Error('Unexpected Apps Script manifest configuration')"
